<title>Rebuild Notebook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700&display=swap">
<style>
/* Layout: one screen, one job. A big box, a big mic, one button. Red-earth ochre accent. */
:root{
  --bg:#141312; --surface:#1d1b19; --line:#38332e;
  --fg:#efe9e2; --muted:#a39a90; --accent:#e07a2e; --accent-ink:#1a0f06; --good:#6fbf73; --warn:#e3b341;
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f6f2ed; --surface:#ffffff; --line:#ddd3c8; --fg:#1d1915; --muted:#6c6158;
  --accent:#b8561a; --accent-ink:#ffffff; --good:#2f7d34; --warn:#9a6a00; color-scheme:light } }
:root[data-theme="light"]{
  --bg:#f6f2ed; --surface:#ffffff; --line:#ddd3c8; --fg:#1d1915; --muted:#6c6158;
  --accent:#b8561a; --accent-ink:#ffffff; --good:#2f7d34; --warn:#9a6a00; color-scheme:light }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.wrap{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2.2rem,9vw,3.2rem);line-height:.95;margin:0;text-transform:uppercase}
h1 span{color:var(--accent)}
textarea{flex:1;width:100%;min-height:260px;resize:none;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:16px;font:400 1.1rem/1.55 var(--body)}
textarea::placeholder{color:var(--muted)}
.partial{color:var(--muted);font-style:italic;min-height:1.5em;margin:-8px 0 0}
.bar{display:flex;gap:12px;align-items:stretch}
.mic{flex:0 0 64px;height:64px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:grid;place-items:center}
.mic.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--accent) 25%,transparent)}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}}
.go{flex:1;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:400 1.6rem var(--display);text-transform:uppercase;letter-spacing:.03em;cursor:pointer}
.go:disabled{opacity:.55}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{text-align:center;color:var(--muted);min-height:1.5em;margin:0}
.status.ok{color:var(--good)} .status.err{color:var(--warn)}
.foot{text-align:center;font-size:.85rem;color:var(--muted);margin:0}
.foot strong{color:var(--fg)}
</style>

<div class="wrap">
  <h1>Just <span>dump it.</span></h1>
  <textarea id="t" placeholder="Whatever's in your head. What you learned, what you're feeling, what you overcame. Don't think, just go."></textarea>
  <p class="partial" id="partial"></p>
  <div class="bar">
    <button class="mic" id="mic" hidden aria-label="Talk">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <button class="go" id="go">Dump it</button>
  </div>
  <p class="status" id="status" role="status"></p>
  <p class="foot">Dark day? Call Lifeline on <strong>13 11 14</strong>. Your boys need you here.</p>
</div>

<script>
const $=id=>document.getElementById(id);
const ta=$("t"),st=$("status");
const store={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
ta.value=store.get("draft")||"";
ta.addEventListener("input",()=>store.set("draft",ta.value));
function say(m,c){st.textContent=m;st.className="status"+(c?" "+c:"")}
function append(x){x=x.trim();if(!x)return;ta.value=(ta.value&&!/\s$/.test(ta.value)?ta.value+" ":ta.value)+x;store.set("draft",ta.value)}

let db=null,waiting=null;
function bank(){if(waiting!=null&&!st.textContent)say(waiting?`${waiting} dump${waiting>1?"s":""} in the bank.`:"")}

$("go").onclick=async()=>{
  const raw=ta.value.trim();
  if(!raw){say("Say something first. One line is enough.","err");ta.focus();return}
  if(!db){say("Not saving here. Open this on claude.ai while signed in.","err");return}
  $("go").disabled=true;
  try{
    await db.collection("dumps").doc().set({raw,createdAt:Date.now(),sorted:false});
    ta.value="";store.set("draft","");say("Saved. Go live your day.","ok");
    setTimeout(()=>{st.textContent="";bank()},4000);
  }catch(e){say("Didn't save: "+(e.message||e.code)+". Your words are still in the box.","err")}
  finally{$("go").disabled=false}
};

(async()=>{
  const use=window.claude&&window.claude.use;
  if(!use){say("Open this on claude.ai to save your dumps.","err");return}
  const [dbNs,dict]=await Promise.all([use("db"),use("dictation")]);
  if(dict){
    let on=false;const mic=$("mic");mic.hidden=false;
    dict.onPartial(({text})=>{$("partial").textContent=text});
    dict.onFinal(({text})=>{$("partial").textContent="";append(text)});
    dict.onState(({state})=>{on=state==="listening";mic.classList.toggle("on",on);mic.setAttribute("aria-label",on?"Stop":"Talk");if(!on)$("partial").textContent=""});
    mic.onclick=()=>{if(on)dict.stop().catch(()=>{});else dict.start().catch(e=>{if(e&&e.code==="not_granted")mic.hidden=true})};
  }
  if(!dbNs){say("Sign in on claude.ai to save your dumps.","err");return}
  db=dbNs;
  db.collection("dumps").where("sorted","==",false).onSnapshot(s=>{waiting=s.size;bank()},()=>{});
})();
</script>
